name: Deploy Worker


# Required GitHub Secrets:
# - CLOUDFLARE_API_TOKEN
# - CLOUDFLARE_D1_DATABASE_ID
#
# Optional GitHub Variables:
# - CLOUDFLARE_ACCOUNT_ID        can be a Secret or Variable
# - WORKER_NAME                  default: line-harness-reservation
# - CLOUDFLARE_D1_DATABASE_NAME   default: line-crm
# - CLOUDFLARE_R2_BUCKET_NAME     default: line-harness-images
# - CLOUDFLARE_SECRETS_STORE_ID   binds Cloudflare Secrets Store secrets when set
# - CLOUDFLARE_SECRETS_STORE_BINDINGS
#     optional comma-separated map: BINDING_NAME=SECRET_NAME,OTHER_NAME
#     when omitted, only required Worker secret binding names are used as secret names
# - RUN_D1_MIGRATIONS             set true to apply packages/db/schema.sql before deploy
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/worker/**'
      - 'packages/db/**'
      - 'packages/shared/**'
      - 'packages/line-sdk/**'
      - '.github/workflows/deploy-worker.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @line-crm/shared --filter @line-crm/line-sdk --filter @line-crm/db build
      - run: pnpm --filter @line-crm/db test
      - run: pnpm --filter @line-harness/sdk test

      - name: Apply D1 schema
        if: ${{ vars.RUN_D1_MIGRATIONS == 'true' }}
        working-directory: apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          CF_D1_DATABASE_NAME: ${{ vars.CLOUDFLARE_D1_DATABASE_NAME }}
        run: pnpm exec wrangler d1 execute "${CF_D1_DATABASE_NAME:-line-crm}" --remote --file ../../packages/db/schema.sql

      - run: pnpm --filter worker build
        env:
          VITE_LIFF_ID: ${{ vars.VITE_LIFF_ID }}
          VITE_BOT_BASIC_ID: ${{ vars.VITE_BOT_BASIC_ID }}
          VITE_CALENDAR_CONNECTION_ID: ${{ vars.VITE_CALENDAR_CONNECTION_ID }}

      - name: Generate Cloudflare deploy config
        working-directory: apps/worker
        env:
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          CF_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          CF_D1_DATABASE_NAME: ${{ vars.CLOUDFLARE_D1_DATABASE_NAME }}
          CF_R2_BUCKET_NAME: ${{ vars.CLOUDFLARE_R2_BUCKET_NAME }}
          CF_WORKER_NAME: ${{ vars.WORKER_NAME }}
          CF_SECRETS_STORE_ID: ${{ vars.CLOUDFLARE_SECRETS_STORE_ID }}
          CF_SECRETS_STORE_BINDINGS: ${{ vars.CLOUDFLARE_SECRETS_STORE_BINDINGS }}
          WORKER_URL: ${{ vars.WORKER_URL }}
          LIFF_URL: ${{ vars.LIFF_URL }}
          LINE_CHANNEL_ID: ${{ vars.LINE_CHANNEL_ID }}
          LINE_LOGIN_CHANNEL_ID: ${{ vars.LINE_LOGIN_CHANNEL_ID }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ vars.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_REDIRECT_URI: ${{ vars.GOOGLE_OAUTH_REDIRECT_URI }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          const required = {
            CF_ACCOUNT_ID: process.env.CF_ACCOUNT_ID,
            CF_D1_DATABASE_ID: process.env.CF_D1_DATABASE_ID,
          };

          for (const [key, value] of Object.entries(required)) {
            if (!value) throw new Error(`${key} is required`);
          }

          const distDir = path.join(process.cwd(), 'dist');
          const candidates = fs.readdirSync(distDir)
            .map((name) => path.join(distDir, name, 'wrangler.json'))
            .filter((file) => fs.existsSync(file))
            .sort((a, b) => fs.statSync(b).mtimeMs - fs.statSync(a).mtimeMs);

          if (candidates.length === 0) throw new Error('Generated wrangler.json was not found');

          const sourcePath = candidates[0];
          const sourceDir = path.dirname(sourcePath);
          const config = JSON.parse(fs.readFileSync(sourcePath, 'utf8'));
          const workerName = process.env.CF_WORKER_NAME || 'line-harness-reservation';
          const d1DatabaseName = process.env.CF_D1_DATABASE_NAME || 'line-crm';
          const r2BucketName = process.env.CF_R2_BUCKET_NAME || 'line-harness-images';
          const secretsStoreId = process.env.CF_SECRETS_STORE_ID?.trim();

          config.name = workerName;
          config.topLevelName = workerName;
          config.account_id = process.env.CF_ACCOUNT_ID;
          config.main = path.relative(process.cwd(), path.join(sourceDir, config.main)).replaceAll('\\', '/');
          if (config.assets?.directory) {
            config.assets.directory = path.relative(
              process.cwd(),
              path.join(sourceDir, config.assets.directory),
            ).replaceAll('\\', '/');
          }
          config.d1_databases = [{
            binding: 'DB',
            database_name: d1DatabaseName,
            database_id: process.env.CF_D1_DATABASE_ID,
          }];
          config.r2_buckets = [{
            binding: 'IMAGES',
            bucket_name: r2BucketName,
          }];

          const plainVars = [
            'WORKER_URL',
            'LIFF_URL',
            'LINE_CHANNEL_ID',
            'LINE_LOGIN_CHANNEL_ID',
            'GOOGLE_OAUTH_CLIENT_ID',
            'GOOGLE_OAUTH_REDIRECT_URI',
          ].reduce((acc, key) => {
            const value = process.env[key]?.trim();
            if (value) acc[key] = value;
            return acc;
          }, {});
          config.vars = {
            ...(config.vars || {}),
            ...plainVars,
          };

          if (secretsStoreId) {
            const defaultBindings = [
              'API_KEY',
              'LINE_CHANNEL_SECRET',
              'LINE_CHANNEL_ACCESS_TOKEN',
            ];
            const rawBindings = process.env.CF_SECRETS_STORE_BINDINGS?.trim();
            const bindings = (rawBindings ? rawBindings.split(',') : defaultBindings)
              .map((entry) => entry.trim())
              .filter(Boolean)
              .map((entry) => {
                const [binding, secretName] = entry.split('=').map((part) => part.trim());
                return {
                  binding,
                  store_id: secretsStoreId,
                  secret_name: secretName || binding,
                };
              });

            config.secrets_store_secrets = bindings;
          }

          const deployConfigPath = path.join(process.cwd(), '.wrangler-ci.json');
          fs.writeFileSync(deployConfigPath, JSON.stringify(config, null, 2));
          NODE

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/worker
          command: deploy --config .wrangler-ci.json
