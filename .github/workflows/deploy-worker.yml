name: Deploy Worker

# Required GitHub Secrets:
# - CLOUDFLARE_API_TOKEN
# - CLOUDFLARE_D1_DATABASE_ID
#
# Optional GitHub Variables:
# - CLOUDFLARE_ACCOUNT_ID        can be a Secret or Variable
# - WORKER_NAME                  default: line-harness-reservation
# - CLOUDFLARE_D1_DATABASE_NAME   default: line-crm
# - CLOUDFLARE_R2_BUCKET_NAME     default: line-harness-images
# - CLOUDFLARE_SECRETS_STORE_ID   binds Cloudflare Secrets Store secrets when set
# - CLOUDFLARE_SECRETS_STORE_BINDINGS
#     optional comma-separated map: BINDING_NAME=SECRET_NAME,OTHER_NAME
#     when omitted, only required Worker secret binding names are used as secret names
# - RUN_D1_MIGRATIONS             set true to apply production-safe D1 compatibility patches before deploy
on:
  workflow_dispatch:
  
  push:
    branches: [main]
    paths:
      - 'apps/worker/**'
      - 'packages/db/**'
      - 'packages/shared/**'
      - 'packages/line-sdk/**'
      - '.github/workflows/deploy-worker.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @line-crm/shared --filter @line-crm/line-sdk --filter @line-crm/db build
      - run: pnpm --filter @line-crm/db test
      - run: pnpm --filter @line-harness/sdk test

      - name: Remove local dev secrets
        run: rm -f apps/worker/.dev.vars

      - name: Apply D1 compatibility patches
        if: ${{ vars.RUN_D1_MIGRATIONS == 'true' }}
        working-directory: apps/worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          CF_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          CF_D1_DATABASE_NAME: ${{ vars.CLOUDFLARE_D1_DATABASE_NAME }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const accountId = process.env.CF_ACCOUNT_ID?.trim();
          const databaseId = process.env.CF_D1_DATABASE_ID?.trim();
          const databaseName = process.env.CF_D1_DATABASE_NAME?.trim() || 'line-crm';

          if (!accountId) throw new Error('CF_ACCOUNT_ID is required');
          if (!databaseId) throw new Error('CF_D1_DATABASE_ID is required');

          fs.writeFileSync('.wrangler-d1-ci.json', JSON.stringify({
            name: 'line-harness-d1-migration',
            account_id: accountId,
            compatibility_date: '2024-12-01',
            d1_databases: [{
              binding: 'DB',
              database_name: databaseName,
              database_id: databaseId,
            }],
          }, null, 2));
          NODE
          db="${CF_D1_DATABASE_NAME:-line-crm}"
          wrangler_d1() {
            pnpm exec wrangler d1 execute "$db" --remote --config .wrangler-d1-ci.json "$@"
          }
          wrangler_d1_allow_duplicate() {
            set +e
            output=$(pnpm exec wrangler d1 execute "$db" --remote --config .wrangler-d1-ci.json "$@" 2>&1)
            status=$?
            set -e
            echo "$output"
            if [ "$status" -eq 0 ]; then
              return 0
            fi
            if echo "$output" | grep -qiE 'duplicate column name|already exists'; then
              echo "Ignoring already-applied D1 patch."
              return 0
            fi
            return "$status"
          }

          # Do not execute packages/db/schema.sql against an existing production DB.
          # CREATE TABLE IF NOT EXISTS does not add newly introduced columns, so
          # later CREATE INDEX statements can fail with "no such column".
          # Apply only additive, idempotent compatibility patches here.
          wrangler_d1 --command "CREATE TABLE IF NOT EXISTS entry_routes (id TEXT PRIMARY KEY, ref_code TEXT UNIQUE NOT NULL, name TEXT NOT NULL, tag_id TEXT REFERENCES tags (id) ON DELETE SET NULL, scenario_id TEXT REFERENCES scenarios (id) ON DELETE SET NULL, redirect_url TEXT, is_active INTEGER NOT NULL DEFAULT 1, created_at TEXT NOT NULL DEFAULT (datetime('now')), updated_at TEXT NOT NULL DEFAULT (datetime('now')))"
          wrangler_d1 --command "CREATE TABLE IF NOT EXISTS ref_tracking (id TEXT PRIMARY KEY, ref_code TEXT NOT NULL, friend_id TEXT REFERENCES friends (id) ON DELETE CASCADE, entry_route_id TEXT REFERENCES entry_routes (id) ON DELETE SET NULL, source_url TEXT, created_at TEXT NOT NULL DEFAULT (datetime('now')))"
          wrangler_d1 --command "CREATE INDEX IF NOT EXISTS idx_entry_routes_ref ON entry_routes (ref_code)"
          wrangler_d1 --command "CREATE INDEX IF NOT EXISTS idx_ref_tracking_ref ON ref_tracking (ref_code)"
          wrangler_d1 --command "CREATE INDEX IF NOT EXISTS idx_ref_tracking_friend ON ref_tracking (friend_id)"
          wrangler_d1 --file ../../packages/db/migrations/006_tracked_links.sql || true
          wrangler_d1 --file ../../packages/db/migrations/007_forms.sql || true
          wrangler_d1 --file ../../packages/db/migrations/024_form_opens.sql || true

          # Google Calendar integration tables. Safe for existing production DBs.
          wrangler_d1 --command "CREATE TABLE IF NOT EXISTS google_calendar_connections (id TEXT PRIMARY KEY, calendar_id TEXT NOT NULL, access_token TEXT, access_token_expires_at TEXT, refresh_token TEXT, api_key TEXT, auth_type TEXT NOT NULL DEFAULT 'api_key', is_active INTEGER NOT NULL DEFAULT 1, created_at TEXT NOT NULL DEFAULT (strftime('%Y-%m-%dT%H:%M:%f', 'now', '+9 hours')), updated_at TEXT NOT NULL DEFAULT (strftime('%Y-%m-%dT%H:%M:%f', 'now', '+9 hours')))"
          wrangler_d1 --command "CREATE TABLE IF NOT EXISTS calendar_bookings (id TEXT PRIMARY KEY, connection_id TEXT NOT NULL REFERENCES google_calendar_connections (id) ON DELETE CASCADE, friend_id TEXT REFERENCES friends (id) ON DELETE SET NULL, event_id TEXT, title TEXT NOT NULL, start_at TEXT NOT NULL, end_at TEXT NOT NULL, status TEXT NOT NULL DEFAULT 'confirmed' CHECK (status IN ('confirmed', 'cancelled', 'completed')), metadata TEXT, created_at TEXT NOT NULL DEFAULT (strftime('%Y-%m-%dT%H:%M:%f', 'now', '+9 hours')), updated_at TEXT NOT NULL DEFAULT (strftime('%Y-%m-%dT%H:%M:%f', 'now', '+9 hours')))"
          wrangler_d1 --command "CREATE INDEX IF NOT EXISTS idx_calendar_bookings_friend ON calendar_bookings (friend_id)"
          wrangler_d1 --command "CREATE INDEX IF NOT EXISTS idx_calendar_bookings_start ON calendar_bookings (start_at)"

          wrangler_d1_allow_duplicate --command "ALTER TABLE friends ADD COLUMN line_account_id TEXT"
          wrangler_d1_allow_duplicate --command "ALTER TABLE friends ADD COLUMN ref_code TEXT"
          wrangler_d1_allow_duplicate --command "ALTER TABLE chats ADD COLUMN line_account_id TEXT"
          wrangler_d1_allow_duplicate --command "ALTER TABLE reservation_resources ADD COLUMN google_calendar_connection_id TEXT"
          wrangler_d1_allow_duplicate --command "ALTER TABLE reservation_resources ADD COLUMN slot_interval_minutes INTEGER NOT NULL DEFAULT 60"
          wrangler_d1_allow_duplicate --command "ALTER TABLE reservation_resources ADD COLUMN timezone TEXT NOT NULL DEFAULT 'Asia/Tokyo'"
          wrangler_d1_allow_duplicate --command "ALTER TABLE reservation_menus ADD COLUMN price_infant INTEGER"
          wrangler_d1_allow_duplicate --command "ALTER TABLE reservation_menus ADD COLUMN capacity_count_adult INTEGER NOT NULL DEFAULT 1 CHECK (capacity_count_adult IN (0, 1))"
          wrangler_d1_allow_duplicate --command "ALTER TABLE reservation_menus ADD COLUMN capacity_count_child INTEGER NOT NULL DEFAULT 1 CHECK (capacity_count_child IN (0, 1))"
          wrangler_d1_allow_duplicate --command "ALTER TABLE reservation_menus ADD COLUMN capacity_count_infant INTEGER NOT NULL DEFAULT 1 CHECK (capacity_count_infant IN (0, 1))"
          wrangler_d1_allow_duplicate --command "ALTER TABLE reservations ADD COLUMN infant_count INTEGER NOT NULL DEFAULT 0"
          wrangler_d1_allow_duplicate --command "ALTER TABLE reservations ADD COLUMN capacity_people INTEGER NOT NULL DEFAULT 0"
          wrangler_d1_allow_duplicate --command "ALTER TABLE reservation_items ADD COLUMN infant_count INTEGER NOT NULL DEFAULT 0"
          wrangler_d1_allow_duplicate --command "ALTER TABLE reservation_items ADD COLUMN capacity_people INTEGER NOT NULL DEFAULT 0"
          wrangler_d1_allow_duplicate --command "ALTER TABLE tracked_links ADD COLUMN intro_template_id TEXT"
          wrangler_d1_allow_duplicate --command "ALTER TABLE tracked_links ADD COLUMN reward_template_id TEXT"
          wrangler_d1_allow_duplicate --command "ALTER TABLE forms ADD COLUMN on_submit_message_type TEXT"
          wrangler_d1_allow_duplicate --command "ALTER TABLE forms ADD COLUMN on_submit_message_content TEXT"
          wrangler_d1_allow_duplicate --command "ALTER TABLE forms ADD COLUMN on_submit_webhook_url TEXT"
          wrangler_d1_allow_duplicate --command "ALTER TABLE forms ADD COLUMN on_submit_webhook_headers TEXT"
          wrangler_d1_allow_duplicate --command "ALTER TABLE forms ADD COLUMN on_submit_webhook_fail_message TEXT"
          wrangler_d1_allow_duplicate --command "ALTER TABLE ref_tracking ADD COLUMN fbclid TEXT"
          wrangler_d1_allow_duplicate --command "ALTER TABLE ref_tracking ADD COLUMN gclid TEXT"
          wrangler_d1_allow_duplicate --command "ALTER TABLE ref_tracking ADD COLUMN twclid TEXT"
          wrangler_d1_allow_duplicate --command "ALTER TABLE ref_tracking ADD COLUMN ttclid TEXT"
          wrangler_d1_allow_duplicate --command "ALTER TABLE ref_tracking ADD COLUMN utm_source TEXT"
          wrangler_d1_allow_duplicate --command "ALTER TABLE ref_tracking ADD COLUMN utm_medium TEXT"
          wrangler_d1_allow_duplicate --command "ALTER TABLE ref_tracking ADD COLUMN utm_campaign TEXT"
          wrangler_d1_allow_duplicate --command "ALTER TABLE ref_tracking ADD COLUMN user_agent TEXT"
          wrangler_d1_allow_duplicate --command "ALTER TABLE ref_tracking ADD COLUMN ip_address TEXT"

          wrangler_d1 --command "CREATE INDEX IF NOT EXISTS idx_friends_line_account_id ON friends (line_account_id)"
          wrangler_d1 --command "CREATE INDEX IF NOT EXISTS idx_friends_ref_code ON friends (ref_code)"
          wrangler_d1 --command "CREATE INDEX IF NOT EXISTS idx_chats_line_account_id ON chats (line_account_id)"
          wrangler_d1 --command "CREATE INDEX IF NOT EXISTS idx_ref_tracking_entry_route ON ref_tracking (entry_route_id)"
          wrangler_d1 --command "CREATE INDEX IF NOT EXISTS idx_reservation_resources_account ON reservation_resources (line_account_id)"

      - run: pnpm --filter worker build
        env:
          VITE_LIFF_ID: ${{ vars.VITE_LIFF_ID }}
          VITE_BOT_BASIC_ID: ${{ vars.VITE_BOT_BASIC_ID }}
          VITE_CALENDAR_CONNECTION_ID: ${{ vars.VITE_CALENDAR_CONNECTION_ID }}

      - name: Remove generated dev secrets
        run: find apps/worker/dist -name .dev.vars -type f -delete

      - name: Generate Cloudflare deploy config
        working-directory: apps/worker
        env:
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          CF_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
          CF_D1_DATABASE_NAME: ${{ vars.CLOUDFLARE_D1_DATABASE_NAME }}
          CF_R2_BUCKET_NAME: ${{ vars.CLOUDFLARE_R2_BUCKET_NAME }}
          CF_WORKER_NAME: ${{ vars.WORKER_NAME }}
          CF_SECRETS_STORE_ID: ${{ vars.CLOUDFLARE_SECRETS_STORE_ID }}
          CF_SECRETS_STORE_BINDINGS: ${{ vars.CLOUDFLARE_SECRETS_STORE_BINDINGS }}
          WORKER_URL: ${{ vars.WORKER_URL }}
          LIFF_URL: ${{ vars.LIFF_URL }}
          LINE_CHANNEL_ID: ${{ vars.LINE_CHANNEL_ID }}
          LINE_LOGIN_CHANNEL_ID: ${{ vars.LINE_LOGIN_CHANNEL_ID }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ vars.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_REDIRECT_URI: ${{ vars.GOOGLE_OAUTH_REDIRECT_URI }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');

          const required = {
            CF_ACCOUNT_ID: process.env.CF_ACCOUNT_ID,
            CF_D1_DATABASE_ID: process.env.CF_D1_DATABASE_ID,
          };

          for (const [key, value] of Object.entries(required)) {
            if (!value) throw new Error(`${key} is required`);
          }

          const distDir = path.join(process.cwd(), 'dist');
          const candidates = fs.readdirSync(distDir)
            .map((name) => path.join(distDir, name, 'wrangler.json'))
            .filter((file) => fs.existsSync(file))
            .sort((a, b) => fs.statSync(b).mtimeMs - fs.statSync(a).mtimeMs);

          if (candidates.length === 0) throw new Error('Generated wrangler.json was not found');

          const sourcePath = candidates[0];
          const sourceDir = path.dirname(sourcePath);
          const config = JSON.parse(fs.readFileSync(sourcePath, 'utf8'));
          const workerName = process.env.CF_WORKER_NAME || 'line-harness-reservation';
          const d1DatabaseName = process.env.CF_D1_DATABASE_NAME || 'line-crm';
          const r2BucketName = process.env.CF_R2_BUCKET_NAME || 'line-harness-images';
          const secretsStoreId = process.env.CF_SECRETS_STORE_ID?.trim();

          config.name = workerName;
          config.topLevelName = workerName;
          config.account_id = process.env.CF_ACCOUNT_ID;
          config.main = path.relative(process.cwd(), path.join(sourceDir, config.main)).replaceAll('\\', '/');
          if (config.assets?.directory) {
            config.assets.directory = path.relative(
              process.cwd(),
              path.join(sourceDir, config.assets.directory),
            ).replaceAll('\\', '/');
          }
          config.d1_databases = [{
            binding: 'DB',
            database_name: d1DatabaseName,
            database_id: process.env.CF_D1_DATABASE_ID,
          }];
          config.r2_buckets = [{
            binding: 'IMAGES',
            bucket_name: r2BucketName,
          }];

          const plainVars = [
            'WORKER_URL',
            'LIFF_URL',
            'LINE_CHANNEL_ID',
            'LINE_LOGIN_CHANNEL_ID',
            'GOOGLE_OAUTH_CLIENT_ID',
            'GOOGLE_OAUTH_REDIRECT_URI',
          ].reduce((acc, key) => {
            const value = process.env[key]?.trim();
            if (value) acc[key] = value;
            return acc;
          }, {});
          config.vars = {
            ...(config.vars || {}),
            ...plainVars,
          };

          if (secretsStoreId) {
            const defaultBindings = [
              'API_KEY',
              'LINE_CHANNEL_ACCESS_TOKEN',
              'LINE_CHANNEL_SECRET',
              'LINE_LOGIN_CHANNEL_ID',
              'LINE_LOGIN_CHANNEL_SECRET',
              'LIFF_URL',
              'WORKER_URL',
              'GOOGLE_OAUTH_CLIENT_ID',
              'GOOGLE_OAUTH_CLIENT_SECRET',
              'GOOGLE_OAUTH_REDIRECT_URI',
            ];
            const rawBindings = process.env.CF_SECRETS_STORE_BINDINGS?.trim();
            const bindings = (rawBindings ? rawBindings.split(',') : defaultBindings)
              .map((entry) => entry.trim())
              .filter(Boolean)
              .map((entry) => {
                const [binding, secretName] = entry.split('=').map((part) => part.trim());
                return {
                  binding,
                  store_id: secretsStoreId,
                  secret_name: secretName || binding,
                };
              });

            config.secrets_store_secrets = bindings;
          }

          const deployConfigPath = path.join(process.cwd(), '.wrangler-ci.json');
          fs.writeFileSync(deployConfigPath, JSON.stringify(config, null, 2));
          NODE

      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/worker
          command: deploy --config .wrangler-ci.json
