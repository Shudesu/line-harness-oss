name: paypay-recurring plugin
on:
  pull_request:
    paths: ['examples/plugins/paypay-recurring/**', '.github/workflows/plugin-paypay-recurring-ci.yml']
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/plugins/paypay-recurring
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
