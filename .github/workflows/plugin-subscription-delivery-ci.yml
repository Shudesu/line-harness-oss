name: Subscription delivery plugin
on:
  pull_request:
    paths: ['examples/plugins/subscription-delivery/**', '.github/workflows/plugin-subscription-delivery-ci.yml']
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/plugins/subscription-delivery
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
