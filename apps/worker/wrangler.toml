name = "hyhome-harness-dev"
main = "src/index.ts"
compatibility_date = "2024-12-01"
# nodejs_compat is required by @line-harness/update-engine which pulls in
# `node:stream` (Readable.fromWeb), `node:zlib` (createGunzip), `node:crypto`
# (createHash), and the `tar-stream` package for bundle parsing during the
# /admin/update/* self-update flow. Without this flag the route imports
# fail at runtime. compatibility_date 2024-09-23+ is required for the flag.
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# ═══════════════════════════════════════════════════════════════
# デフォルト = テスト環境 (noda@)
# 使い方: npx wrangler deploy
# ═══════════════════════════════════════════════════════════════
account_id = "2b10b71ddc0b0e3095ebdb354938bc96"

[assets]
directory = "dist/client"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "line-harness-dev"
database_id = "45d9486b-c517-4bfe-8549-10c28c27b5c3"

# R2 は検証フェーズでは無効（画像系機能を使わないため）。
# 本番移行時に Cloudflare Dashboard で R2 を「利用開始」してから有効化する。
# [[r2_buckets]]
# binding = "IMAGES"
# bucket_name = "line-harness-images"

[triggers]
crons = ["*/5 * * * *", "0 */6 * * *"]

# ═══════════════════════════════════════════════════════════════
# Phase 5 self-update vars — consumed by /admin/update/*. Secrets
# (CF_API_TOKEN, ADMIN_API_KEY) must be set via `wrangler secret put`
# and are intentionally absent from this file.
# ═══════════════════════════════════════════════════════════════
[vars]
WORKER_NAME = "hyhome-harness"
ADMIN_PAGES_PROJECT = "hyhome-harness-admin-0cdf2440"
LIFF_PAGES_PROJECT = "hyhome-harness-liff"
D1_DATABASE_ID = "02e337a1-5fd3-426b-ba6d-d2f9085c20da"
MANIFEST_URL = "https://github.com/Shudesu/line-harness-oss/releases/latest/download/release-manifest.json"
# Worker URL はデプロイ後に確定（kashiyu サブドメインに更新）
WORKER_PUBLIC_URL = "https://hyhome-harness.workers.dev"
WORKER_URL = "https://hyhome-harness.workers.dev"
ADMIN_PUBLIC_URL = "https://hyhome-harness-admin-0cdf2440.pages.dev"
LIFF_PUBLIC_URL = "https://hyhome-harness-liff.pages.dev"
CF_ACCOUNT_ID = "3048ba5bd6789dbf21204b466fbf4c8b"

# ═══════════════════════════════════════════════════════════════
# 本番環境は wrangler-prod.toml に分離 (2026-06-07)。
#
# 旧構成は dev 用 wrangler.toml に [env.production] を併設して
# 同一ファイルから本番アカウント (3048ba5b…) と本番 D1 を直接指していた。
# `wrangler deploy --env production` を誤爆すると dev 設定からそのまま
# 本番に書き込めてしまい事故になるため、本番設定は wrangler-prod.toml へ分離。
# あわせて worker 名を `hyhome-harness-dev` に変更し、本番と同名衝突を物理的に
# 不可能にした。本番デプロイは必ず `--config wrangler-prod.toml` を使うこと。
# ═══════════════════════════════════════════════════════════════
